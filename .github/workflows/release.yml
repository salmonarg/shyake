name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            artifact: shyake-linux-x86_64
          - runner: ubuntu-22.04-arm
            artifact: shyake-linux-aarch64
          - runner: macos-15
            artifact: shyake-darwin-arm64
          - runner: macos-15-intel
            artifact: shyake-darwin-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y cmake libcurl4-openssl-dev libssl-dev
          else
            brew install openssl@3
          fi

      # liboqs tag is pinned in .github/actions/liboqs/action.yml
      - uses: ./.github/actions/liboqs

      - name: Build client
        run: make -C client VERSION='${{ github.event.release.tag_name }}'

      - name: Run crypto tests
        run: make -C client test

      - name: Package
        run: |
          STAGE="$(mktemp -d)/${{ matrix.artifact }}"
          mkdir -p "$STAGE"
          cp client/bin/shyake LICENSE README.md "$STAGE/"
          tar -C "$(dirname "$STAGE")" -czf '${{ matrix.artifact }}.tar.gz' \
              '${{ matrix.artifact }}'

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ github.event.release.tag_name }}' \
              '${{ matrix.artifact }}.tar.gz' --clobber
