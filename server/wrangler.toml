name = "shyake-server"
main = "src/index.ts"
compatibility_date = "2024-04-05"

# env variables
[vars]
INSTANCE_DOMAIN = "shyake.eee.coffee"
REGISTRATION_ENABLED = true
RESERVED_USERNAMES = "admin,system,support,noreply,shyake,root,postmaster"
FEDERATION_ENABLED = true
MAX_MAIL_SIZE = 524288 # 512 KiB

[[kv_namespaces]]
binding = "VERSION_CACHE"
id = "3d8c337cb988409cad093b6a1793e36f"

[[d1_databases]]
binding = "DB"
database_name = "shyake-db"
database_id = "5959f25d-73c8-4608-8150-4c7a33ba3243"
migrations_dir = "migrations"

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true
fallbacks = []
